name: Deploy EC2

on:
  workflow_dispatch:
    inputs:
      target_color:
        description: "Which environment to activate (blue or green)"
        required: true
        default: "green"
        type: choice
        options:
          - blue
          - green

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy selected color
        env:
          TARGET_COLOR: ${{ github.event.inputs.target_color }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          if [[ -z "${EC2_USER}" || -z "${EC2_HOST}" ]]; then
            echo "EC2_USER and EC2_HOST secrets must be configured."
            exit 1
          fi

          TARGET_PATH=${DEPLOY_PATH:-/var/www/bg-deployment}

          ssh -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "TARGET_COLOR=${TARGET_COLOR} TARGET_PATH=${TARGET_PATH} bash -s" <<'REMOTE'
            set -euo pipefail

            cd "${TARGET_PATH}"
            git pull

            echo "Building and refreshing \${TARGET_COLOR} service..."
            docker compose -f compose.yml up -d --build app-\${TARGET_COLOR}

            if [ "${TARGET_COLOR}" = "green" ]; then
              ./scripts/switch_to_green.sh
            else
              ./scripts/switch_to_blue.sh
            fi
REMOTE
